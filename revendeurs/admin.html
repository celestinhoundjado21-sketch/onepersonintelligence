<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin revendeurs — One Person Intelligence</title>
<style>
body{margin:0;background:#060a17;color:#eef2ff;font-family:system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:28px 0 8px}
p{color:#8892b0;margin:4px 0 12px}
label{display:block;margin-top:12px;font-size:14px;color:#cfd6ee}
input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;background:#111a30;border:1px solid #1b2540;border-radius:10px;padding:12px;color:#eef2ff;font:inherit}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:13px}
button{margin-top:14px;width:100%;padding:14px;border:none;border-radius:999px;background:#f1f1ee;color:#0b0f1c;font:inherit;font-weight:700;cursor:pointer}
.card{background:#0c1324;border:1px solid #1b2540;border-radius:16px;padding:16px;margin-top:12px}
</style>
</head>
<body>
<main>
<p><a href="/admin/" style="color:#60A5FA">← Mon espace</a> · <a href="https://onepersonintelligence.goatcounter.com/" target="_blank" rel="noopener" style="color:#60A5FA">Mes statistiques</a></p>
<h1>Ajouter un guide ou une vente</h1>
<p>Remplis le formulaire, copie le texte obtenu, puis colle-le dans <b>revendeurs/catalogue.json</b> (ou <b>ventes.json</b>) sur GitHub, ou envoie-le à Claude.</p>

<h2>Nouveau guide</h2>
<div class="card">
<label>Identifiant (ex. guide-07)<input id="g-id"></label>
<label>Titre<input id="g-titre"></label>
<label>Prix en FCFA<input id="g-prix" inputmode="numeric" value="3000"></label>
<label>Niche<select id="g-niche"></select></label>
<label>Lien du produit sur Maketou<input id="g-url" placeholder="https://one-person-intelligence.mymaketou.shop/products/…"></label>
<label>Lien de la vidéo (MP4)<input id="g-video" placeholder="https://…/guide-07.mp4"></label>
<label>Ordre d'apparition (1 = en premier)<input id="g-ordre" inputmode="numeric" value="10"></label>
<button id="g-go">Générer le texte du guide</button>
<label>Texte à copier<textarea id="g-out" readonly></textarea></label>
</div>

<h2>Nouvelle vente (pour Mon Univers)</h2>
<div class="card">
<label>ID revendeur (ex. R-TKRR)<input id="v-id"></label>
<label>Date<input id="v-date" type="date"></label>
<label>Guide (identifiant)<input id="v-guide" placeholder="guide-01"></label>
<label>Montant de la vente (FCFA)<input id="v-montant" inputmode="numeric" value="3000"></label>
<label>Taux de commission<select id="v-taux"><option value="0.5">50 % (Gratuit)</option><option value="0.65">65 % (Turbo)</option><option value="0.7">70 % (VIP)</option></select></label>
<label>Déjà payée ?<select id="v-payee"><option value="false">Non</option><option value="true">Oui</option></select></label>
<button id="v-go">Générer le texte de la vente</button>
<label>Texte à copier<textarea id="v-out" readonly></textarea></label>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
fetch("/revendeurs/catalogue.json", { cache: "no-store" }).then(r => r.json()).then(c => { $("g-niche").innerHTML = c.niches.map(n => `<option value="${n.id}">${n.nom}</option>`).join(""); });
$("v-date").value = new Date().toISOString().slice(0, 10);
$("g-go").onclick = () => {
  const o = { id: $("g-id").value.trim(), titre: $("g-titre").value.trim(), prixXof: +$("g-prix").value || 0, niche: $("g-niche").value, maketouUrl: $("g-url").value.trim(), videoUrl: $("g-video").value.trim(), ordre: +$("g-ordre").value || 99 };
  $("g-out").value = JSON.stringify(o) + ",";
  $("g-out").select();
};
$("v-go").onclick = () => {
  const m = +$("v-montant").value || 0;
  const o = { date: $("v-date").value, guide: $("v-guide").value.trim(), montantXof: m, commissionXof: Math.round(m * +$("v-taux").value), payee: $("v-payee").value === "true" };
  $("v-out").value = "Revendeur " + $("v-id").value.trim() + " :\n" + JSON.stringify(o) + ",";
  $("v-out").select();
};
</script>
</body>
</html>
