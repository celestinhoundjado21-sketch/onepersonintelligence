<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O·I — écran à filmer</title>
<style>
  html,body{margin:0;height:100%;background:#03060f;overflow:hidden;cursor:none;font-family:system-ui,Segoe UI,Arial,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #aide{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);color:#8892b0;font-size:14px;background:rgba(12,19,36,.85);padding:10px 16px;border-radius:10px;cursor:default;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="aide">Clique n'importe où pour passer en plein écran · touche Échap pour sortir</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,D=window.devicePixelRatio||1;
function taille(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',taille);taille();

const savoirs=["Coiffure","Cuisine","Couture","Agriculture","Élevage","Savon","Pâtisserie","Enseignement","Commerce","Maquillage","Tresses","Jus naturels","Soins du corps","Menuiserie","Photo","Informatique"];
const produits=["Guide PDF","Recettes","Formation","Méthode","Modèles","Check-list"];
const vente=["Maketou","Chariow","WhatsApp","Mobile Money","TikTok","Facebook"];

const nodes=[];
function ajoute(label,groupe,r){
  const a=Math.random()*Math.PI*2, d=(groupe===0?0:groupe===1?.16+Math.random()*.08:groupe===2?.3+Math.random()*.06:.42+Math.random()*.05);
  nodes.push({label,groupe,r,a,d,v:(Math.random()-.5)*0.0006,ph:Math.random()*6.28,x:0,y:0});
}
ajoute("O·I",0,9);
savoirs.forEach(s=>ajoute(s,1,3.2));
produits.forEach(s=>ajoute(s,2,4.2));
vente.forEach(s=>ajoute(s,3,4.2));
for(let i=0;i<70;i++)ajoute("",4,1.2+Math.random()*1.3);
nodes.filter(n=>n.groupe===4).forEach(n=>{n.d=.08+Math.random()*.42});

const liens=[];
nodes.forEach((n,i)=>{
  if(n.groupe===1)liens.push([0,i]);
  if(n.groupe===2)liens.push([1+Math.floor(Math.random()*savoirs.length),i]);
  if(n.groupe===3)liens.push([1+savoirs.length+Math.floor(Math.random()*produits.length),i]);
  if(n.groupe===4)liens.push([Math.floor(Math.random()*(1+savoirs.length)),i]);
});
const couleur=["#ffffff","#6d8dff","#34d399","#8b5cf6","#4f7cff"];

const impulsions=[];
function nouvelleImpulsion(){
  const l=liens[Math.floor(Math.random()*liens.length)];
  impulsions.push({l,t:0,s:.006+Math.random()*.01});
}

let t0=performance.now();
function dessine(t){
  const dt=t-t0;t0=t;
  const cx=W/2,cy=H/2,R=Math.min(W,H)*1.05;
  x.fillStyle="#03060f";x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(cx,cy,0,cx,cy,R*.6);
  g.addColorStop(0,"rgba(79,124,255,0.10)");g.addColorStop(1,"rgba(3,6,15,0)");
  x.fillStyle=g;x.fillRect(0,0,W,H);

  nodes.forEach(n=>{
    n.a+=n.v*dt;
    const wob=Math.sin(t*.0006+n.ph)*.012;
    n.x=cx+Math.cos(n.a)*(n.d+wob)*R;
    n.y=cy+Math.sin(n.a)*(n.d+wob)*R*.62;
  });

  x.lineWidth=1;
  liens.forEach(([a,b])=>{
    const A=nodes[a],B=nodes[b];
    x.strokeStyle=B.groupe===4?"rgba(109,141,255,0.10)":"rgba(109,141,255,0.22)";
    x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();
  });

  if(Math.random()<.18)nouvelleImpulsion();
  for(let i=impulsions.length-1;i>=0;i--){
    const p=impulsions[i];p.t+=p.s*dt/16;
    if(p.t>=1){impulsions.splice(i,1);continue}
    const A=nodes[p.l[0]],B=nodes[p.l[1]];
    const px=A.x+(B.x-A.x)*p.t,py=A.y+(B.y-A.y)*p.t;
    x.shadowBlur=14;x.shadowColor="#6d8dff";x.fillStyle="#cfe0ff";
    x.beginPath();x.arc(px,py,1.8,0,7);x.fill();
  }

  nodes.forEach(n=>{
    const puls=1+Math.sin(t*.002+n.ph)*.18;
    x.shadowBlur=n.groupe===0?40:n.groupe===4?6:18;
    x.shadowColor=couleur[n.groupe];
    x.fillStyle=couleur[n.groupe];
    x.beginPath();x.arc(n.x,n.y,n.r*puls,0,7);x.fill();
  });
  x.shadowBlur=0;

  x.textAlign="center";
  nodes.forEach(n=>{
    if(!n.label)return;
    if(n.groupe===0){x.font="600 22px system-ui,Segoe UI,Arial";x.fillStyle="#ffffff";x.fillText(n.label,n.x,n.y-18);return}
    x.font=(n.groupe===1?"12px":"13px")+" system-ui,Segoe UI,Arial";
    x.fillStyle=n.groupe===1?"rgba(220,228,255,.75)":n.groupe===2?"rgba(167,243,208,.9)":"rgba(221,214,254,.9)";
    x.fillText(n.label,n.x,n.y-10);
  });

  x.font="13px system-ui,Segoe UI,Arial";x.textAlign="left";x.fillStyle="rgba(136,146,176,.7)";
  x.fillText("onepersonintelligence.com",22,H-22);
  requestAnimationFrame(dessine);
}
requestAnimationFrame(dessine);

const aide=document.getElementById('aide');
setTimeout(()=>aide.style.opacity=0,6000);
addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});aide.style.opacity=0});
</script>
</body>
</html>
