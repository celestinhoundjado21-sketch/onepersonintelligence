async function verifier(v, err, suite) {
  const c = v.trim().toUpperCase();
  if (!c) { err.textContent = "Tape ton code d'accès."; err.hidden = false; return; }
  try {
    const h = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(c)))).map(b => b.toString(16).padStart(2, "0")).join("");
    if (h !== CODE_HASH) { err.textContent = "Ce code ne fonctionne pas. Vérifie les lettres, ou écris-nous sur WhatsApp."; err.hidden = false; return; }
    S.ouvert = true; S.q = 0; sauver(); suite();
  } catch (e) { err.textContent = "Impossible de vérifier le code ici. Écris-nous sur WhatsApp."; err.hidden = false; }
}

    <h2 style="margin-top:12px">${S.idee.e} ${esc(S.idee.t)}</h2>
    <div class="road">${etapes.map(([k, e, t, d]) => `<button class="step ${S.faits[k] ? "done" : next && next[0] === k ? "now" : ""}" data-k="${k}"><span class="n">${S.faits[k] ? "✅" : e}</span><span style="flex:1"><b>${t}</b><small>${esc(d)}</small></span><span style="color:var(--muted)">›</span></button>`).join("")}</div>
    <div class="card" style="margin-top:18px"><b>🔁 Ta routine de chaque jour</b><ol class="how"><li>Publie le post du jour.</li><li>Réponds à tous les messages dans l'heure.</li><li>Relance une fois ceux qui n'ont pas répondu.</li><li>Après chaque vente, demande un avis.</li></ol></div>`;
  cta(next ? `<button class="btn" id="go">${next[1]} ${next[2]} →</button><button class="link" id="nv">Créer un autre produit</button>` : `<button class="btn" id="nv">✨ Créer un autre produit</button>`);
  $("view").querySelectorAll("[data-k]").forEach(b => b.onclick = () => ouvrir(b.dataset.k));
  if ($("go")) $("go").onclick = () => ouvrir(next[0]);
  $("nv").onclick = () => { const o = S.ouvert; S = neuf(); S.ouvert = o; S.q = 0; aller("question"); };
}
function ouvrir(k) {
  if (k === "produit") return aller("message");
  S.ecran = "route"; sauver(); window.scrollTo(0, 0);
  const retour = () => aller("route");
  if (k === "boutique" && !S.boutique) return choixEcran("Où veux-tu vendre ?", "Tu n'as jamais vendu en ligne ? Commence par WhatsApp : la cliente paie sur ton numéro Mobile Money, tu lui envoies le PDF. Quand les ventes arrivent, passe à une boutique (Maketou ou Chariow) : la cliente paie sur un lien et reçoit le PDF toute seule, même la nuit. Tu pourras en ajouter un autre plus tard.", BOUTIQUES, v => { S.boutique = v; ouvrir("boutique"); }, retour);
  if (k === "clients" && !S.reseau) return choixEcran("Où veux-tu trouver tes clients ?", "Claude te prépare une publication par jour pendant 7 jours.", RESEAUX, v => { S.reseau = v; ouvrir("clients"); }, retour);
  if (k === "boutique") return ecranMessage("boutique", `Vends sur ${BOUTIQUES[S.boutique][1]}`, "1. Envoie ce message à Claude pour recevoir tes textes. 2. Suis les étapes ci-dessous.",
    `<div class="card" style="margin-top:14px"><b>📋 Les étapes</b><ol class="how">${BOUTIQUES[S.boutique][3].map(e => `<li>${esc(e)}</li>`).join("")}</ol><button class="link" id="chg" style="align-self:flex-start">Changer d'endroit de vente</button></div>`, retour), lierChg("boutique");
  if (k === "clients") return ecranMessage("clients", `7 jours sur ${RESEAUX[S.reseau][1]}`, "Envoie ce message à Claude : il te prépare tes publications de la semaine.", `<button class="link" id="chg" style="margin-top:12px">Choisir un autre réseau</button>`, retour), lierChg("reseau");
  if (k === "ventes") return ecranMessage("ventes", "Transforme les messages en ventes", "Envoie ce message à Claude : il te prépare toutes tes réponses WhatsApp.", "", retour);
}
function lierChg(cle) { const c = $("chg"); if (c) c.onclick = () => { S[cle] = null; ouvrir(cle === "reseau" ? "clients" : "boutique"); }; }
function choixEcran(titre, sous, liste, choix, retour) {
  barre(100, retour);
  $("view").innerHTML = `<h2>${titre}</h2><p class="sub">${sous}</p><div class="grid">${Object.entries(liste).map(([k, [e, n, d]]) => `<button class="tile wide" data-k="${k}" style="min-height:76px"><span class="ic">${e}</span><span><b>${esc(n)}</b><br><span style="color:var(--muted);font-size:13px;font-weight:400">${esc(d)}</span></span></button>`).join("")}</div>`;
  cta("");
  $("view").querySelectorAll("[data-k]").forEach(b => b.onclick = () => { choix(b.dataset.k); sauver(); });
}

charger();
if (new URLSearchParams(location.search).has("zero")) { S = neuf(); sauver(); history.replaceState(null, "", location.pathname); }
render();
</script>
</body>
</html>
